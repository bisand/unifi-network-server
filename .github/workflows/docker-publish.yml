name: Build & Publish UniFi Network Server

on:
  workflow_dispatch:      # Manual trigger (always runs; retries whatever is missing)
    inputs:
      version:
        description: 'UniFi version to build (leave blank to auto-detect the latest)'
        type: string
        default: ''
      force_rebuild:
        description: 'Rebuild and push even if this tag is already on Docker Hub'
        type: boolean
        default: false
      skip_deploy:
        description: 'Build and push only — do not update the deploy manifest'
        type: boolean
        default: false
  schedule:
    # 03:00 UTC is the discovery run: it notices a new UniFi release and
    # publishes it. The later slots are retry slots — a run whose own in-run
    # retries were exhausted gets picked up again within hours instead of
    # waiting a full day, because UNIFI_VERSION still lags the target. On a
    # day with nothing to do each one costs about ten seconds.
    - cron: '0 3,9,15,21 * * *'

permissions:
  contents: write

# Never run two publishes at once (e.g. a manual run during the nightly one)
concurrency:
  group: publish-unifi
  cancel-in-progress: false

env:
  IMAGE: bisand/unifi-network-server
  # Coordinates of the private GitOps repo whose manifests a Flux cluster
  # reconciles. Committing the new image reference there IS the deploy — the
  # cluster pulls, this workflow never reaches it, and no kubeconfig exists in
  # GitHub.
  #
  # These are secrets rather than literals ONLY so this public repository does
  # not publish the private repo's name, branch and internal layout — and
  # because Actions masks secret values in logs, which are public here too.
  DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
  DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
  DEPLOY_MANIFEST: ${{ secrets.DEPLOY_MANIFEST }}

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          # The staleness check reads the commit date of the last UNIFI_VERSION
          # bump, which a shallow clone would not contain. The repo is ~550 KB.
          fetch-depth: 0

      # UNIFI_VERSION is the "last version that was published AND deployed successfully".
      # It is only bumped by the final step of this workflow, so any run that fails
      # anywhere leaves it behind and the next scheduled run retries the whole thing.
      #
      # Version detection reads TWO independent sources and takes the newest
      # buildable one. It used to read only glennr's HTML page, which on
      # 2026-09-20 was found still listing 10.6.101 as newest while already
      # serving an installer for 10.6.106. Nothing failed and nothing alerted —
      # every run just decided there was no new release and exited in ten
      # seconds, so the cluster silently sat on a stale version. One lagging
      # source must not be able to do that again.
      - name: Determine target version
        id: version
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '[:space:]' < UNIFI_VERSION)"
          OVERRIDE="${{ github.event.inputs.version }}"

          # The build installs via glennr's per-version script, so a release is
          # only buildable once that script exists — whoever has announced it.
          installer_exists() {
            curl -fsSI --max-time 60 --retry 5 --retry-delay 5 --retry-connrefused \
                 "https://get.glennr.nl/unifi/install/unifi-$1.sh" >/dev/null 2>&1
          }

          if [ -n "$OVERRIDE" ]; then
            TARGET="$OVERRIDE"
            echo "Using version override: $TARGET"
            if ! printf '%s' "$TARGET" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Version override '${TARGET}' is not a valid version."
              exit 1
            fi
            # An explicit request for a version we cannot build is an error, not
            # something to quietly work around.
            if ! installer_exists "$TARGET"; then
              echo "::error::No installer available at https://get.glennr.nl/unifi/install/unifi-${TARGET}.sh"
              exit 1
            fi
          else
            # Source 1 — Ubiquiti's own release feed. This is what the controller's
            # "Update to Network Application X available" notice reads, so it is
            # authoritative for what the newest release actually is.
            UBNT=""
            for attempt in 1 2 3; do
              if curl -sSL --max-time 60 -o ubnt.json \
                   "https://fw-update.ubnt.com/api/firmware-latest?filter=eq~~product~~unifi-controller&filter=eq~~channel~~release"; then
                UBNT="$(jq -r '[._embedded.firmware[]?.version] | .[]' ubnt.json 2>/dev/null \
                        | sed 's/^v//; s/+.*//' \
                        | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
                if [ -n "$UBNT" ]; then break; fi
              fi
              echo "Ubiquiti release feed unavailable (attempt ${attempt}/3); retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            rm -f ubnt.json

            # Source 2 — glennr's page. Kept as a second opinion so that if the
            # Ubiquiti feed moves or breaks, detection degrades instead of dying.
            PAGE=""
            for attempt in 1 2 3 4 5; do
              if curl -sSL --max-time 60 -o unifi-install.html https://glennr.nl/s/unifi-network-controller; then
                PAGE="$(grep -oP 'unifi-\K[0-9]+\.[0-9]+\.[0-9]+' unifi-install.html | sort -V | tail -n1 || true)"
                if [ -n "$PAGE" ]; then break; fi
              fi
              echo "Version page unavailable (attempt ${attempt}/5); retrying in $((attempt * 10))s..."
              sleep $((attempt * 10))
            done
            rm -f unifi-install.html

            echo "Detected — ubiquiti: ${UBNT:-<none>}, glennr page: ${PAGE:-<none>}, current: ${CURRENT}"

            if [ -z "$UBNT" ] && [ -z "$PAGE" ]; then
              echo "::error::Both version sources are unavailable — cannot determine a target."
              exit 1
            fi

            # Newest candidate first; take the newest that is actually buildable.
            # Staying on CURRENT is the safe default, so a bad parse can never
            # downgrade :latest — only an explicit override may move backwards.
            TARGET="$CURRENT"
            for CANDIDATE in $(printf '%s\n%s\n' "$UBNT" "$PAGE" \
                               | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -r -u); do
              if [ "$(printf '%s\n%s\n' "$CANDIDATE" "$CURRENT" | sort -V | tail -n1)" != "$CANDIDATE" ]; then
                echo "Ignoring ${CANDIDATE}: older than the current ${CURRENT}."
                continue
              fi
              if [ "$CANDIDATE" = "$CURRENT" ]; then
                break
              fi
              if installer_exists "$CANDIDATE"; then
                TARGET="$CANDIDATE"
                break
              fi
              # Ubiquiti routinely announces a release before glennr ships its
              # installer. That is a wait, not a failure — leave UNIFI_VERSION
              # alone and let a later run pick it up once the script appears.
              echo "::warning::UniFi ${CANDIDATE} is released but glennr has no installer for it yet — a later run will pick it up."
            done
          fi

          # A manual dispatch rebuilds whatever the target is, including CURRENT,
          # so confirm that is buildable before spending minutes on it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "$OVERRIDE" ]; then
            if ! installer_exists "$TARGET"; then
              echo "::error::No installer available at https://get.glennr.nl/unifi/install/unifi-${TARGET}.sh"
              exit 1
            fi
          fi

          # Run on every manual dispatch, or whenever the last fully successful
          # version differs from the target (new release, or an earlier failed run).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$TARGET" != "$CURRENT" ]; then
            SHOULD_RUN=true
          else
            SHOULD_RUN=false
          fi

          echo "current=$CURRENT"       >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"         >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          {
            echo "### UniFi publish"
            echo "- last successful: \`$CURRENT\`"
            echo "- ubiquiti feed:   \`${UBNT:-n/a}\`"
            echo "- glennr page:     \`${PAGE:-n/a}\`"
            echo "- target:          \`$TARGET\`"
            echo "- run:             \`$SHOULD_RUN\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # A skipped release and a genuinely quiet night are both a green ten-second
      # run. That ambiguity is what let the cluster sit on a stale version for
      # weeks without anything looking wrong, so every run now states how long it
      # has been since UNIFI_VERSION last moved — the number is on the run page
      # whether or not it crosses a threshold.
      #
      # It warns rather than fails on purpose. The standalone Network Server is
      # being sunset, so upstream going quiet for good is an expected end state,
      # and failing on it would turn that into permanent noise.
      #
      # Note what this cannot catch: a workflow disabled for inactivity does not
      # run, so it cannot warn about itself. That one is re-enabled by hand with
      # `gh workflow enable docker-publish.yml`.
      - name: Report time since the last published version
        env:
          STALE_AFTER_DAYS: '45'
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.current }}"
          TARGET="${{ steps.version.outputs.target }}"

          LAST="$(git log -1 --format=%cI -- UNIFI_VERSION || true)"
          if [ -z "$LAST" ]; then
            echo "::warning::No commit history for UNIFI_VERSION — cannot tell when the last publish was."
            exit 0
          fi

          DAYS=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          echo "UNIFI_VERSION (${CURRENT}) last changed ${DAYS} day(s) ago, at ${LAST}."
          echo "- last publish:    \`${DAYS}\` day(s) ago" >> "$GITHUB_STEP_SUMMARY"

          # About to publish something new, so the clock is being reset in this run.
          if [ "$TARGET" != "$CURRENT" ]; then
            echo "Publishing ${TARGET} in this run — not stale."
            exit 0
          fi

          if [ "$DAYS" -ge "$STALE_AFTER_DAYS" ]; then
            echo "::warning::No new UniFi version in ${DAYS} days (threshold ${STALE_AFTER_DAYS}). Either upstream is genuinely quiet, or every version source this workflow reads has gone stale at once — compare against the controller's own update notice before assuming it is idle."
            {
              echo ""
              echo "> [!WARNING]"
              echo "> **No new UniFi version in ${DAYS} days.**"
              echo "> Upstream may genuinely be quiet — the standalone Network Server is being"
              echo "> sunset — or every source this workflow reads may have gone stale at once."
              echo "> Check the controller's own \`Update available\` notice before assuming idle."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Docker Buildx
        if: steps.version.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.version.outputs.should_run == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Retrying a run that only failed at the deploy step should not rebuild the
      # image: if the tag is already on Docker Hub, go straight to the redeploy.
      - name: Check whether the tag is already published
        id: published
        if: steps.version.outputs.should_run == 'true'
        run: |
          set -uo pipefail
          TAG="${{ steps.version.outputs.target }}"
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            echo "force_rebuild requested — building regardless."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "${IMAGE}:${TAG} is already published — skipping the build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "${IMAGE}:${TAG} is not published yet."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Almost everything that goes wrong here is transient and external: an
      # apt mirror or the glennr download flaking inside the build, a Docker Hub
      # 5xx on push, or the GHA cache export dying. Retry in place instead of
      # failing the run and leaving the publish to the next scheduled one.
      #
      # Each attempt leans on the build cache less than the last, so a poisoned
      # or unreachable cache cannot fail every attempt the same way:
      #   1. read + write the GHA cache — the fast, normal path
      #   2. read only  — a failing cache *export* can no longer break the build
      #   3. no cache   — a corrupt cache entry can no longer break the build
      # A cold rebuild is roughly six minutes, so three attempts plus backoff
      # stay well inside the job timeout.
      #
      # This is `docker buildx build` rather than docker/build-push-action so the
      # retry loop and the cache escalation are expressible at all; the flags
      # mirror what the action was invoking.
      - name: Build and push image
        id: build
        if: steps.version.outputs.should_run == 'true' && steps.published.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.target }}
        run: |
          set -uo pipefail
          METADATA="$RUNNER_TEMP/build-metadata.json"
          ATTEMPTS=3

          for attempt in $(seq 1 "$ATTEMPTS"); do
            case "$attempt" in
              1) CACHE_ARGS=(--cache-from type=gha --cache-to type=gha,mode=max) ;;
              2) CACHE_ARGS=(--cache-from type=gha) ;;
              *) CACHE_ARGS=(--no-cache) ;;
            esac

            echo "::group::Build attempt ${attempt}/${ATTEMPTS} (${CACHE_ARGS[*]})"
            rm -f "$METADATA"
            # Actions runs this step as `bash -e`, so a bare failing build would
            # abort the step before the loop ever saw it. `|| status=$?` keeps the
            # failure ours to handle whether or not -e is in effect.
            status=0
            docker buildx build \
              --platform linux/amd64 \
              --build-arg "UNIFI_VERSION=${TAG}" \
              --tag "${IMAGE}:${TAG}" \
              --tag "${IMAGE}:latest" \
              --metadata-file "$METADATA" \
              "${CACHE_ARGS[@]}" \
              --push \
              . || status=$?
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              # Hand the digest straight to the deploy so it never has to ask the
              # registry what it was we just pushed.
              DIGEST="$(jq -r '."containerimage.digest" // empty' "$METADATA")"
              echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
              echo "Pushed ${IMAGE}:${TAG} (${DIGEST:-digest unresolved}) on attempt ${attempt}."
              exit 0
            fi

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "::warning::Build attempt ${attempt}/${ATTEMPTS} failed (exit ${status}); retrying in $((attempt * 30))s..."
              sleep $((attempt * 30))
            fi
          done

          echo "::error::Build failed after ${ATTEMPTS} attempts. UNIFI_VERSION is left untouched, so the next scheduled run retries."
          exit 1

      # An already-published tag still needs :latest pointing at it — cheap manifest
      # copy, no rebuild.
      - name: Retag latest
        if: steps.version.outputs.should_run == 'true' && steps.published.outputs.exists == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.target }}"
          .github/scripts/retry.sh 3 10 -- \
            docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${TAG}"

      # The deploy manifest pins by digest, not by tag, so the deploy needs the
      # digest whether we just built the image or found it already published.
      - name: Resolve image digest
        id: digest
        if: steps.version.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.target }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            # The image is known to exist by this point — either we just pushed it
            # or we found it already published — so a failure here is the registry
            # flaking, not a missing tag. Retry instead of losing the deploy.
            DIGEST="$(.github/scripts/retry.sh 3 10 -- \
              docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
          fi
          if ! printf '%s' "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Could not resolve a digest for ${IMAGE}:${TAG} (got '${DIGEST}')"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE}:${TAG}@${DIGEST}"

      # This commit IS the deploy. Flux polls that repo every minute and
      # reconciles every five, so the rollout lands within ~5 minutes with
      # nothing inbound to the cluster and no kubeconfig in GitHub.
      #
      # Nothing here echoes the repo, branch or manifest path. They are secrets,
      # so Actions would mask them anyway, but this repository is public and so
      # are its run logs — do not rely on masking alone.
      - name: Deploy — pin the new image in the GitOps repo
        id: deploy
        if: steps.version.outputs.should_run == 'true' && github.event.inputs.skip_deploy != 'true'
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          TAG: ${{ steps.version.outputs.target }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          for v in DEPLOY_KEY DEPLOY_REPO DEPLOY_BRANCH DEPLOY_MANIFEST; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "::error::Secret $v is not set — see the Build pipeline section of README.md."
              exit 1
            fi
          done

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          CLONE="$RUNNER_TEMP/gitops"
          for attempt in 1 2 3; do
            rm -rf "$CLONE"
            if git clone --quiet --depth 1 --branch "$DEPLOY_BRANCH" "$DEPLOY_REPO" "$CLONE"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not clone the GitOps repo after 3 attempts."
              exit 1
            fi
            echo "Clone failed (attempt ${attempt}/3); retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done

          REF="${IMAGE}:${TAG}@${DIGEST}"
          python3 .github/scripts/pin-image.py "$CLONE/$DEPLOY_MANIFEST" "$IMAGE" "$REF" >/dev/null

          cd "$CLONE"
          if git diff --quiet; then
            echo "The manifest already pins ${REF} — nothing to deploy."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEPLOY_MANIFEST"
          git commit --quiet -m "unifi: deploy ${TAG}" \
                     -m "Image ${REF}, published by unifi-network-server run ${GITHUB_RUN_ID}."

          # That repo has other authors; rebase rather than fail on a race.
          for attempt in 1 2 3; do
            if git push --quiet origin "HEAD:$DEPLOY_BRANCH"; then
              echo "Deployed ${REF} — Flux reconciles within ~5 minutes."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/3); rebasing and retrying..."
            sleep $((attempt * 5))
            git fetch --quiet origin "$DEPLOY_BRANCH"
            git pull --quiet --rebase origin "$DEPLOY_BRANCH"
          done
          echo "::error::Could not push the deploy commit after 3 attempts. UNIFI_VERSION is left untouched, so the next run will retry."
          exit 1

      # Runs only when every step above succeeded, so UNIFI_VERSION always reflects
      # a version that is both published and deployed. Never bump it earlier.
      - name: Commit version bump
        if: steps.version.outputs.should_run == 'true' && steps.version.outputs.target != steps.version.outputs.current
        run: |
          set -euo pipefail
          echo "${{ steps.version.outputs.target }}" > UNIFI_VERSION
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add UNIFI_VERSION
          git commit -m "chore: update UNIFI_VERSION to ${{ steps.version.outputs.target }}"

          # main may have moved while the build ran. This commit is the record of
          # "published AND deployed"; if it never lands, the next run rebuilds and
          # redeploys a version that is already live — so retry rather than let a
          # push race undo the whole run.
          for attempt in 1 2 3; do
            if ! git pull --rebase --autostash origin main; then
              echo "Rebase onto origin/main failed (attempt ${attempt}/3)."
            elif git push; then
              exit 0
            fi
            echo "Version bump push failed (attempt ${attempt}/3); retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the UNIFI_VERSION bump after 3 attempts."
          exit 1
